<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>订单付款</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../layui/css/layui.css?v=20261024-payment-ui">
    <link rel="stylesheet" href="pay.css?v=20261024-deadline-5">
    <script src="pay.js?v=20261024-deadline-5" defer></script>
</head>
<body>
<header class="payment-header">
    <div class="header-inner"><span class="page-title">订单付款</span><span class="provider-brand"><img id="provider-icon" src="weixin.jpg" width="130" height="30" alt="" hidden><span id="provider">正在获取订单</span></span></div>
</header>
<main>
    <section class="amount-band" aria-label="付款金额">
        <p class="amount-label">应付金额</p><strong id="amount">--</strong>
        <p id="amount-note" class="sr-only" hidden></p>
        <p id="amount-warning" class="amount-warning" hidden></p>
        <p id="countdown" role="timer"></p>
    </section>
    <p id="status" role="status" aria-live="polite">正在加载订单</p>
    <section id="payment" hidden>
        <nav id="kinds" aria-label="收款方式">
            <button id="normal" type="button" aria-pressed="true">收款码</button>
            <button id="reward" type="button" aria-pressed="false">赞赏码</button>
        </nav>
        <div id="codes" class="code-grid"></div>
        <div id="switcher" class="switcher">
            <button id="previous" class="icon-button" type="button" title="上一组收款码" aria-label="上一组收款码"><i class="layui-icon layui-icon-left" aria-hidden="true"></i></button>
            <span id="position"></span>
            <button id="next" type="button"><i class="layui-icon layui-icon-refresh" aria-hidden="true"></i> 换一个收款码</button>
        </div>
        <div class="payment-notices">
            <p class="notice"><span id="restricted-note">如无法付款，请联系商家。</span><button id="switch-kind" class="inline-action" type="button" hidden></button></p>
            <p class="waiting">已付款请等待到账确认，<strong class="caution">请勿重复支付</strong>。</p>
            <p class="deadline-notice"><strong>请在倒计时结束前完成支付。</strong><span>超时订单将失效，请勿继续付款，请返回重新下单。</span></p>
        </div>
    </section>
    <details id="details" hidden>
        <summary>订单详情<i class="layui-icon layui-icon-down" aria-hidden="true"></i></summary>
        <dl><dt>商户订单</dt><dd id="merchant"></dd><dt>订单金额</dt><dd id="original"></dd></dl>
        <label id="rotation-control" class="rotation" hidden><input id="rotation" type="checkbox"> 自动轮播收款码</label>
    </details>
    <a id="return" hidden>返回商家</a>
</main>
</body>
</html>
