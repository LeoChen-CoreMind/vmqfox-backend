services:
  # VMQFox 前端服务
  vmqfox-frontend:
    image: hulisang/vmqfox-frontend@sha256:4ae8fdea55298c45bff5ffca70943ce03224b702a29e1b8bc051939df6f8a841
    container_name: vmqfox-frontend
    ports:
      - "${VMQ_FRONTEND_PORT:-3006}:80"
    restart: unless-stopped
    environment:
      TZ: "${VMQ_TIMEZONE:-Asia/Shanghai}"
    depends_on:
      - backend
    networks:
      - vmqfox-network

  # VMQFox 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vmqfox-backend:local
    container_name: vmqfox-backend
    ports:
      - "${VMQ_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      TZ: "${VMQ_TIMEZONE:-Asia/Shanghai}"
      APP_TIMEZONE: "${VMQ_TIMEZONE:-Asia/Shanghai}"
      APP_DEBUG: "${VMQ_APP_DEBUG:-false}"
      APP_TRACE: "false"
      APP_FRONTEND_URL: "${VMQ_FRONTEND_URL:-http://localhost:3006}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env.docker}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.docker}"
      SESSION_SECURE_COOKIE: "${VMQ_SESSION_SECURE_COOKIE:-false}"
      DB_TYPE: mysql
      DB_HOSTNAME: mysql
      DB_DATABASE: "${VMQ_DB_NAME:-vmq}"
      DB_USERNAME: "${VMQ_DB_USERNAME:-vmqfox}"
      DB_PASSWORD: "${VMQ_DB_PASSWORD:?Set VMQ_DB_PASSWORD in .env.docker}"
      DB_HOSTPORT: "3306"
      DB_CHARSET: utf8mb4
      DB_PREFIX: ""
      DB_DEBUG: "${VMQ_DB_DEBUG:-false}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_SELECT: "0"
      CACHE_DRIVER: file
      SESSION_DRIVER: file
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vmqfox-network

  # MySQL 数据库服务，仅在 Compose 内部网络开放
  mysql:
    image: mysql:5.7
    container_name: vmqfox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${VMQ_DB_ROOT_PASSWORD:?Set VMQ_DB_ROOT_PASSWORD in .env.docker}"
      MYSQL_DATABASE: "${VMQ_DB_NAME:-vmq}"
      MYSQL_USER: "${VMQ_DB_USERNAME:-vmqfox}"
      MYSQL_PASSWORD: "${VMQ_DB_PASSWORD:?Set VMQ_DB_PASSWORD in .env.docker}"
      TZ: "${VMQ_TIMEZONE:-Asia/Shanghai}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./vmq.sql:/docker-entrypoint-initdb.d/vmq.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - vmqfox-network

  # Redis 缓存服务，仅在 Compose 内部网络开放
  redis:
    image: redis:7-alpine
    container_name: vmqfox-redis
    restart: unless-stopped
    environment:
      TZ: "${VMQ_TIMEZONE:-Asia/Shanghai}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s
    networks:
      - vmqfox-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  vmqfox-network:
    driver: bridge
