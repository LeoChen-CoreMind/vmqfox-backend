<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR delete smoke test</title>
    <link rel="stylesheet" href="../../public/layui/css/layui.css">
    <link rel="stylesheet" href="../../public/css/qrcode-admin.css">
    <style>body { margin: 24px; }</style>
</head>
<body data-smoke="pending">
    <section id="list"></section>
    <script src="../../public/js/qrcode-admin.js"></script>
    <script src="../../public/js/qrcode-list.js"></script>
    <script>
        var calls = [];
        window.layer = {
            alert: function () {},
            close: function () {},
            confirm: function (message, callback) { callback(1); },
            msg: function () {}
        };
        QrAdmin.showDependencyHelp = function () {};
        QrAdmin.request = function (options) {
            calls.push(options);
            if (options.url === 'index.php/api/qrcode/delete') {
                return Promise.resolve({});
            }
            var query = new URL(options.url, location.href).searchParams;
            return Promise.resolve({
                total: 1,
                page: Number(query.get('page')) || 1,
                limit: Number(query.get('limit')) || 12,
                sort: query.get('sort') || 'newest',
                items: [{
                    id: '17',
                    price: '1.00',
                    pay_url: 'https://qr.alipay.com/example',
                    state: 0
                }]
            });
        };

        var mounted = QrList.mount({root: '#list', type: 2});
        setTimeout(function () {
            mounted.getState().page = 2;
            var sort = document.querySelector('[data-role="sort"]');
            sort.value = 'amount_desc';
            sort.dispatchEvent(new Event('change', {bubbles: true}));
            setTimeout(function () {
                var sortRequest = calls.filter(function (call) {
                    return /sort=amount_desc/.test(call.url || '');
                }).pop();
                document.querySelector('[data-action="delete"]').click();
                setTimeout(function () {
                    var deletion = calls.filter(function (call) {
                        return call.url === 'index.php/api/qrcode/delete';
                    })[0] || {};
                    var passed = sortRequest && /page=1/.test(sortRequest.url) &&
                        mounted.getState().sort === 'amount_desc' &&
                        deletion.method === 'POST' && deletion.data && deletion.data.id === '17';
                    document.body.setAttribute('data-smoke', passed ? 'pass' : 'fail');
                }, 0);
            }, 0);
        }, 0);
    </script>
</body>
</html>
